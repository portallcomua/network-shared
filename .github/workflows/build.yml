name: Build Network Shared EXE

on:
  push:
    branches: [ main, master, "feature/**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Перевірка синтаксису
        run: python -m py_compile network_shared.py

      - name: Збірка EXE
        run: |
          pyinstaller --noconfirm --clean --noconsole --onefile --collect-all wsgidav --collect-all cheroot --collect-all requests --icon=icon.ico --add-data "icon.ico;." --name Network-Shared network_shared.py

      - name: Збереження готового EXE
        uses: actions/upload-artifact@v4
        with:
          name: Network-Shared-Windows
          path: dist/Network-Shared.exe
