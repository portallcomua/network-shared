name: Build Network Shared EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Збірка EXE без консольного вікна
        run: |
          pyinstaller --noconsole --onefile --name network-shared network_shared.py

      - name: Збереження готового EXE
        uses: actions/upload-artifact@v4
        with:
          name: Network-Shared-Windows
          path: dist/network-shared.exe
